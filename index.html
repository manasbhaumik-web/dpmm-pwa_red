    <!-- Primary Meta -->

    <!-- Auto-Clear Cache Script -->
    <script>
      // Immediately unregister all Service Workers to prevent stale PWA caching
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (let registration of registrations) {
            registration.unregister();
            console.log('ServiceWorker unregistered successfully');
          }
        }).catch(function(err) {
          console.log('ServiceWorker unregistration failed: ', err);
        });
      }
      
      // Delete all CacheStorage (offline files) to force fresh load
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (let name of names) {
            caches.delete(name);
          }
        });
      }
    </script>
    <meta name="keywords" content="DPMM, dewan perniagaan melayu malaysia, keahlian, usahawan melayu, PWA, business association, malaysia" />
